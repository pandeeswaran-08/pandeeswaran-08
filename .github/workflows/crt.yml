name: Generate CRT Contribution SVGs

on:
  schedule:
    # Runs daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/crt.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate CRT Contribution SVGs
        uses: stefashkaa/github-profile-crt@v1
        with:
          github-user: pandeeswaran-08
          themes: amber,crt
          output-dir: assets
          commit-and-push: true
          commit-message: 'chore: Update CRT contribution monitor [skip ci]'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

