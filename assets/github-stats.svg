<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 495 195" width="495" height="195" fill="none">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f141c"/>
      <stop offset="50%" stop-color="#161e2b"/>
      <stop offset="100%" stop-color="#0f141c"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffb347"/>
      <stop offset="100%" stop-color="#ffcc80"/>
    </linearGradient>
    <filter id="statGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .card-title {
      font-family: ui-monospace, SFMono-Regular, "Segoe UI", sans-serif;
      font-size: 16px;
      font-weight: 700;
      fill: #36bcf7;
      letter-spacing: 0.05em;
    }
    .metric-label {
      font-family: "Segoe UI", Ubuntu, sans-serif;
      font-size: 13px;
      font-weight: 600;
      fill: #8b949e;
    }
    .metric-value {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 15px;
      font-weight: 700;
      fill: #e6edf3;
    }
    .highlight {
      fill: #ffb347;
      font-weight: 700;
    }
    .tag-badge {
      font-family: ui-monospace, SFMono-Regular, monospace;
      font-size: 10px;
      font-weight: 700;
      fill: #00ffa3;
    }
  </style>

  <!-- Container -->
  <rect x="1" y="1" width="493" height="193" rx="10" fill="url(#cardBg)" stroke="#30363d" stroke-width="1.2"/>

  <!-- Title -->
  <text x="25" y="32" class="card-title">⚡ Pandeeswaran's Engineering Stats</text>
  <line x1="25" y1="42" x2="470" y2="42" stroke="#30363d" stroke-width="1"/>

  <!-- Row 1: Public Repositories -->
  <circle cx="34" cy="65" r="4" fill="#36bcf7"/>
  <text x="46" y="69" class="metric-label">Public Repositories</text>
  <text x="470" y="69" class="metric-value" text-anchor="end">31</text>

  <!-- Row 2: Total Contributions -->
  <circle cx="34" cy="95" r="4" fill="#ffb347"/>
  <text x="46" y="99" class="metric-label">Year Contributions</text>
  <text x="470" y="99" class="metric-value highlight" text-anchor="end">127+</text>

  <!-- Row 3: Core Domain -->
  <circle cx="34" cy="125" r="4" fill="#38ef7d"/>
  <text x="46" y="129" class="metric-label">Core Specialization</text>
  <text x="470" y="129" class="metric-value" text-anchor="end">AI &amp; Data Science (3rd Yr)</text>

  <!-- Row 4: Primary Languages -->
  <circle cx="34" cy="155" r="4" fill="#a371f7"/>
  <text x="46" y="159" class="metric-label">Primary Languages</text>
  <text x="470" y="159" class="metric-value" text-anchor="end">Python, TypeScript, JavaScript</text>

  <!-- Bottom Accent Line -->
  <line x1="25" y1="178" x2="470" y2="178" stroke="url(#goldGrad)" stroke-width="2" opacity="0.6"/>
</svg>

