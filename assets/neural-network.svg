<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 200" width="840" height="200" fill="none">
  <defs>
    <linearGradient id="nnBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f17"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0b0f17"/>
    </linearGradient>
    <filter id="nodeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseLine {
      0% { stroke-dashoffset: 40; opacity: 0.3; }
      50% { opacity: 0.8; }
      100% { stroke-dashoffset: 0; opacity: 0.3; }
    }
    @keyframes pulseNode {
      0%, 100% { transform: scale(1); opacity: 0.85; }
      50% { transform: scale(1.18); opacity: 1; }
    }
    .synapse {
      stroke: #36bcf7;
      stroke-width: 1.2;
      stroke-dasharray: 6 4;
      animation: pulseLine 2.8s linear infinite;
    }
    .synapse-amber {
      stroke: #ffb347;
      stroke-width: 1.2;
      stroke-dasharray: 6 4;
      animation: pulseLine 3.2s linear infinite reverse;
    }
    .synapse-green {
      stroke: #38ef7d;
      stroke-width: 1.2;
      stroke-dasharray: 6 4;
      animation: pulseLine 2.4s linear infinite;
    }
    .node-pulse {
      transform-origin: center;
      transform-box: fill-box;
      animation: pulseNode 3s ease-in-out infinite;
    }
    .layer-label {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 11px;
      font-weight: 700;
      fill: #8b949e;
      letter-spacing: 0.08em;
    }
  </style>

  <!-- Background Canvas -->
  <rect width="840" height="200" rx="14" fill="url(#nnBg)" stroke="#30363d" stroke-width="1"/>

  <!-- Layer Labels -->
  <text x="140" y="24" class="layer-label" text-anchor="middle">INPUT LAYER</text>
  <text x="326" y="24" class="layer-label" text-anchor="middle">HIDDEN LAYER 1</text>
  <text x="513" y="24" class="layer-label" text-anchor="middle">HIDDEN LAYER 2</text>
  <text x="700" y="24" class="layer-label" text-anchor="middle">OUTPUT (PREDICT)</text>

  <!-- Synapse Lines (Connecting Layers) -->
  <!-- Layer 0 to 1 -->
  <g class="synapse" opacity="0.45">
    <line x1="140" y1="55" x2="326" y2="45"/><line x1="140" y1="55" x2="326" y2="78"/><line x1="140" y1="55" x2="326" y2="112"/><line x1="140" y1="55" x2="326" y2="145"/><line x1="140" y1="55" x2="326" y2="175"/>
    <line x1="140" y1="95" x2="326" y2="45"/><line x1="140" y1="95" x2="326" y2="78"/><line x1="140" y1="95" x2="326" y2="112"/><line x1="140" y1="95" x2="326" y2="145"/><line x1="140" y1="95" x2="326" y2="175"/>
    <line x1="140" y1="135" x2="326" y2="45"/><line x1="140" y1="135" x2="326" y2="78"/><line x1="140" y1="135" x2="326" y2="112"/><line x1="140" y1="135" x2="326" y2="145"/><line x1="140" y1="135" x2="326" y2="175"/>
    <line x1="140" y1="175" x2="326" y2="45"/><line x1="140" y1="175" x2="326" y2="78"/><line x1="140" y1="175" x2="326" y2="112"/><line x1="140" y1="175" x2="326" y2="145"/><line x1="140" y1="175" x2="326" y2="175"/>
  </g>

  <!-- Layer 1 to 2 -->
  <g class="synapse-amber" opacity="0.45">
    <line x1="326" y1="45" x2="513" y2="45"/><line x1="326" y1="45" x2="513" y2="78"/><line x1="326" y1="45" x2="513" y2="112"/><line x1="326" y1="45" x2="513" y2="145"/><line x1="326" y1="45" x2="513" y2="175"/>
    <line x1="326" y1="78" x2="513" y2="45"/><line x1="326" y1="78" x2="513" y2="78"/><line x1="326" y1="78" x2="513" y2="112"/><line x1="326" y1="78" x2="513" y2="145"/><line x1="326" y1="78" x2="513" y2="175"/>
    <line x1="326" y1="112" x2="513" y2="45"/><line x1="326" y1="112" x2="513" y2="78"/><line x1="326" y1="112" x2="513" y2="112"/><line x1="326" y1="112" x2="513" y2="145"/><line x1="326" y1="112" x2="513" y2="175"/>
    <line x1="326" y1="145" x2="513" y2="45"/><line x1="326" y1="145" x2="513" y2="78"/><line x1="326" y1="145" x2="513" y2="112"/><line x1="326" y1="145" x2="513" y2="145"/><line x1="326" y1="145" x2="513" y2="175"/>
    <line x1="326" y1="175" x2="513" y2="45"/><line x1="326" y1="175" x2="513" y2="78"/><line x1="326" y1="175" x2="513" y2="112"/><line x1="326" y1="175" x2="513" y2="145"/><line x1="326" y1="175" x2="513" y2="175"/>
  </g>

  <!-- Layer 2 to Output -->
  <g class="synapse-green" opacity="0.5">
    <line x1="513" y1="45" x2="700" y2="65"/><line x1="513" y1="45" x2="700" y2="112"/><line x1="513" y1="45" x2="700" y2="160"/>
    <line x1="513" y1="78" x2="700" y2="65"/><line x1="513" y1="78" x2="700" y2="112"/><line x1="513" y1="78" x2="700" y2="160"/>
    <line x1="513" y1="112" x2="700" y2="65"/><line x1="513" y1="112" x2="700" y2="112"/><line x1="513" y1="112" x2="700" y2="160"/>
    <line x1="513" y1="145" x2="700" y2="65"/><line x1="513" y1="145" x2="700" y2="112"/><line x1="513" y1="145" x2="700" y2="160"/>
    <line x1="513" y1="175" x2="700" y2="65"/><line x1="513" y1="175" x2="700" y2="112"/><line x1="513" y1="175" x2="700" y2="160"/>
  </g>

  <!-- Nodes -->
  <!-- Layer 0 (Input - Cyan) -->
  <g fill="#36bcf7" filter="url(#nodeGlow)">
    <circle cx="140" cy="55" r="7" class="node-pulse"/>
    <circle cx="140" cy="95" r="7" class="node-pulse" style="animation-delay: 0.5s;"/>
    <circle cx="140" cy="135" r="7" class="node-pulse" style="animation-delay: 1s;"/>
    <circle cx="140" cy="175" r="7" class="node-pulse" style="animation-delay: 1.5s;"/>
  </g>

  <!-- Layer 1 (Hidden 1 - Amber) -->
  <g fill="#ffb347" filter="url(#nodeGlow)">
    <circle cx="326" cy="45" r="7.5" class="node-pulse" style="animation-delay: 0.2s;"/>
    <circle cx="326" cy="78" r="7.5" class="node-pulse" style="animation-delay: 0.7s;"/>
    <circle cx="326" cy="112" r="7.5" class="node-pulse" style="animation-delay: 1.2s;"/>
    <circle cx="326" cy="145" r="7.5" class="node-pulse" style="animation-delay: 1.7s;"/>
    <circle cx="326" cy="175" r="7.5" class="node-pulse" style="animation-delay: 2.2s;"/>
  </g>

  <!-- Layer 2 (Hidden 2 - Amber) -->
  <g fill="#ffcc80" filter="url(#nodeGlow)">
    <circle cx="513" cy="45" r="7.5" class="node-pulse" style="animation-delay: 0.4s;"/>
    <circle cx="513" cy="78" r="7.5" class="node-pulse" style="animation-delay: 0.9s;"/>
    <circle cx="513" cy="112" r="7.5" class="node-pulse" style="animation-delay: 1.4s;"/>
    <circle cx="513" cy="145" r="7.5" class="node-pulse" style="animation-delay: 1.9s;"/>
    <circle cx="513" cy="175" r="7.5" class="node-pulse" style="animation-delay: 2.4s;"/>
  </g>

  <!-- Layer 3 (Output - Emerald Green) -->
  <g fill="#38ef7d" filter="url(#nodeGlow)">
    <circle cx="700" cy="65" r="8.5" class="node-pulse" style="animation-delay: 0.3s;"/>
    <circle cx="700" cy="112" r="8.5" class="node-pulse" style="animation-delay: 1.1s;"/>
    <circle cx="700" cy="160" r="8.5" class="node-pulse" style="animation-delay: 1.8s;"/>
  </g>
</svg>

