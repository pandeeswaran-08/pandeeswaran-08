<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 24" width="800" height="24" fill="none">
  <defs>
    <linearGradient id="divGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38ef7d" stop-opacity="0"/>
      <stop offset="20%" stop-color="#36bcf7" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#ffb347" stop-opacity="0.9"/>
      <stop offset="80%" stop-color="#36bcf7" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#38ef7d" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <line x1="40" y1="12" x2="760" y2="12" stroke="url(#divGrad)" stroke-width="1.8" filter="url(#glow)"/>
  <circle cx="400" cy="12" r="4.5" fill="#ffb347" filter="url(#glow)">
    <animate attributeName="r" values="3.5;5.5;3.5" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;1;0.7" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="370" cy="12" r="2" fill="#36bcf7" opacity="0.8"/>
  <circle cx="430" cy="12" r="2" fill="#36bcf7" opacity="0.8"/>
  <circle cx="340" cy="12" r="1.5" fill="#38ef7d" opacity="0.6"/>
  <circle cx="460" cy="12" r="1.5" fill="#38ef7d" opacity="0.6"/>
</svg>

